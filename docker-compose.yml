services:
  api:
    build: ./backend
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - barcode_data:/app/data
    environment:
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - APP_BASE_PATH=${APP_BASE_PATH:-/barcode-db}
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        - VITE_BASE_PATH=${VITE_BASE_PATH:-/}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  barcode_data:
